name: CI

# PR + push main 时触发：对源码做可复现检查
#  - cargo fmt --check（格式）
#  - cargo clippy（lint 警告即失败）
#  - cargo build（编译）
#  - cargo test（锁定依赖，当前以编译型测试为主）
#
# Rust 版本由仓库根目录 rust-toolchain.toml 固定，避免 stable 漂移导致
# Clippy 规则突然变化。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: Lint + Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked

  readme:
    name: README link check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: |
          set -e
          # 简单 sanity check：所有 .md 引用的相对路径必须存在
          # 排除：URL（http/https）、GitHub 渲染时插入的 blob/tree 路径、纯锚点、mailto
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path(".")
          md_files = list(root.rglob("*.md"))
          # 跳过被 .gitignore 屏蔽的目录
          skip = {"target", "node_modules", "分发"}
          bad = []
          for md in md_files:
              if any(s in md.parts for s in skip):
                  continue
              for link in re.findall(r"\]\(([^)]+)\)", md.read_text(encoding="utf-8")):
                  # 跳过外部 URL 与纯锚点
                  if link.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  # 跳过 GitHub 风格的 blob/<branch>/ 与 tree/<branch>/ 链接
                  # （这些是 GitHub 渲染时自动加的，仓库里没那个目录）
                  if re.search(r"^\.\./\.\./(blob|tree)/", link) or re.search(r"^(blob|tree)/", link):
                      continue
                  # 去掉锚点
                  path = link.split("#", 1)[0]
                  if not path:
                      continue
                  target = (md.parent / path).resolve()
                  if not target.exists():
                      bad.append(f"{md}: -> {link}")
          if bad:
              print("Broken internal links:")
              for b in bad:
                  print(" ", b)
              raise SystemExit(1)
          print(f"OK: {len(md_files)} markdown files checked")
          PY
