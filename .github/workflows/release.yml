name: Release

# 推送 v* 标签时触发：多平台编译 + 统一打包 + 单点创建 GitHub Release。
# 矩阵 job 只上传 artifact，避免每个平台 job 重复写 Release body/assets。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            binary: ilink-wm1.exe
            zip_suffix: win_x64
          - name: linux-x64
            os: ubuntu-latest
            binary: ilink-wm1
            zip_suffix: linux_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            binary: ilink-wm1
            zip_suffix: linux_aarch64
          - name: macos-arm64
            os: macos-latest
            binary: ilink-wm1
            zip_suffix: macos_aarch64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.os }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package binary zip
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="stage"
          mkdir -p "$STAGE"
          cp "target/release/${{ matrix.binary }}" "$STAGE/"
          cp -r web "$STAGE/"
          cp LICENSE README.md CHANGELOG.md 用户协议.md 部署指南.md "$STAGE/"
          if [[ "${{ matrix.name }}" == "windows-x64" ]]; then
            cp start.ps1 install-service.ps1 "$STAGE/"
          fi
          cd "$STAGE"
          OUT="../ilink_wm_v${VER}_${{ matrix.zip_suffix }}.zip"
          if command -v zip >/dev/null 2>&1; then
            zip -r "$OUT" .
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            "/c/Program Files/7-Zip/7z.exe" a -tzip "$OUT" .
          else
            echo "no zip tool available" >&2
            exit 1
          fi
          cd ..
          sha256sum "ilink_wm_v${VER}_${{ matrix.zip_suffix }}.zip" \
            > "ilink_wm_v${VER}_${{ matrix.zip_suffix }}.zip.sha256"

      - name: Package source zip (linux-x64 only)
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/package.py --skip-exe
          mv 分发/*.zip 分发/*.sha256 .

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: |
            *.zip
            *.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Verify release baseline and checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("Cargo.toml version not found")
          print(match.group(1))
          PY
          )"
          [[ "$TAG_VERSION" == "$CARGO_VERSION" ]] || {
            echo "tag v${TAG_VERSION} != Cargo.toml ${CARGO_VERSION}" >&2
            exit 1
          }

          BODY_PATH="$RUNNER_TEMP/release-body.md"
          awk -v target="^## v${TAG_VERSION}([^0-9]|$)" '
            $0 ~ target { capture=1; print; next }
            capture && /^## / { capture=0 }
            capture { print }
          ' CHANGELOG.md > "$BODY_PATH"
          [[ -s "$BODY_PATH" ]] || {
            echo "CHANGELOG.md 中未找到 ## v${TAG_VERSION} 段" >&2
            exit 1
          }

          cd release-assets
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          [[ "${#archives[@]}" -eq 5 ]] || {
            echo "期望 5 个平台/源码 zip，实际 ${#archives[@]} 个" >&2
            exit 1
          }
          : > SHA256SUMS.txt
          for archive in "${archives[@]}"; do
            sidecar="${archive}.sha256"
            [[ -f "$sidecar" ]] || { echo "缺少 $sidecar" >&2; exit 1; }
            sha256sum -c "$sidecar"
            sha256sum "$archive" >> SHA256SUMS.txt
          done
          sha256sum -c <(sed 's#^#./#' SHA256SUMS.txt)
          cd ..
          printf 'release_body=%s\n' "$BODY_PATH" >> "$GITHUB_OUTPUT"

      - name: Create or update release once
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.verify.outputs.release_body }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Verify published asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
