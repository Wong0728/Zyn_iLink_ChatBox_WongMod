name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit and deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # cargo-audit v0.22.2 依赖 kstring 2.0.4 要求 Rust ≥1.96.0，
      # 而 rust-toolchain.toml 固定了 1.95.0，此处显式装 stable 覆盖。
      - name: Install Rust stable for audit tools
        uses: dtolnay/rust-toolchain@stable

      - name: RustSec advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo deny checks
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
